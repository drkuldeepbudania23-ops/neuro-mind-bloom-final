name: CI (build check — no deploy)

on:
  push:
  workflow_dispatch:

# Build & test only. This workflow never deploys anything.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Placeholder, non-secret values so the build can compile. They point at no real project.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-nmb-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-nmb-ci
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-nmb-ci.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
